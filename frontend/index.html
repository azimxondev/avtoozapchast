<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Avto Sklad — Ombor & Buxgalteriya Boshqaruv Tizimi</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/dashboard.css">
  <link rel="stylesheet" href="/static/css/products.css">
  <link rel="stylesheet" href="/static/css/admin.css">
  <link rel="stylesheet" href="/static/css/modal.css">
  <link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body>

  <!-- Standalone Demo Mode Banner (Hidden by default in production per strict spec) -->
  <div id="standalone-demo-banner" class="demo-banner" style="display:none;">
    <div class="demo-banner-left">
      <span class="demo-badge">Demo Rejim</span>
      <span>Test rejimi</span>
    </div>
    <div class="demo-role-selector">
      <select id="demo-role-select" onchange="App.onRoleChange(this.value)">
        <option value="SUPER_ADMIN">Bosh Admin</option>
        <option value="ADMIN">Admin</option>
        <option value="USER">Mijoz</option>
      </select>
    </div>
  </div>

  <!-- Header -->
  <header class="app-header">
    <div class="header-brand">
      <div class="header-logo-icon">🚗</div>
      <div class="header-title-group">
        <h1>Avto Sklad</h1>
        <span>Ombor & Buxgalteriya ERP</span>
      </div>
    </div>
    <div class="header-actions">
      <div id="header-role-badge"></div>
      <button id="app-refresh-btn" class="btn btn-ghost btn-sm" onclick="App.refreshData()" title="Ma'lumotlarni yangilash (Real-time Refresh)" style="font-size:15px; padding: 4px 8px;">
        🔄
      </button>
      <button id="dnd-toggle-btn" class="btn btn-ghost btn-sm" onclick="App.toggleDND()" title="Bezovta qilinmasin (Do Not Disturb)" style="font-size:16px; padding: 4px 8px;">
        🔔
      </button>
      <button id="theme-toggle-btn" class="btn btn-ghost btn-sm" onclick="App.toggleTheme()" title="Mavzuni almashtirish">
        🌙
      </button>
    </div>
  </header>

  <!-- App Loading Screen -->
  <div id="app-loading-screen" style="position:fixed;inset:0;background:var(--bg-main);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999">
    <div style="width:44px;height:44px;border:3px solid var(--border);border-top-color:var(--brand-blue);border-radius:50%;animation:spin 0.8s linear infinite"></div>
    <p style="margin-top:16px;color:var(--text-muted);font-size:13px;font-weight:600">Avto Sklad tizimi yuklanmoqda...</p>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Main App Body -->
  <main class="app-container">
    <div id="tab-content"></div>
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav" id="bottom-nav"></nav>

  <!-- Modals and Bottom Sheets -->
  <div id="modal-overlay" class="modal-overlay" onclick="ProductsView.closeModal()">
    <div id="modal-root" onclick="event.stopPropagation()"></div>
  </div>

  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <!-- Scripts in dependency order -->
  <script src="/static/js/utils.js"></script>
  <script src="/static/js/state.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/charts.js"></script>
  <script src="/static/js/views/dashboard.js"></script>
  <script src="/static/js/views/products.js"></script>
  <script src="/static/js/views/inventory.js"></script>
  <script src="/static/js/views/stock_modal.js"></script>
  <script src="/static/js/views/transactions.js"></script>
  <script src="/static/js/views/analytics.js"></script>
  <script src="/static/js/views/user_catalog.js"></script>
  <script src="/static/js/views/admin_management.js"></script>
  <script src="/static/js/views/settings.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
