<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Avto Sklad — Ombor & Buxgalteriya Boshqaruv Tizimi</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/static/css/style.css?v=6.0">
  <link rel="stylesheet" href="/static/css/dashboard.css?v=6.0">
  <link rel="stylesheet" href="/static/css/products.css?v=6.0">
  <link rel="stylesheet" href="/static/css/admin.css?v=6.0">
  <link rel="stylesheet" href="/static/css/modal.css?v=6.0">
  <link rel="stylesheet" href="/static/css/responsive.css?v=6.0">
  <link rel="stylesheet" href="/static/css/ai_features.css?v=6.0">
</head>
<body>

  <!-- Standalone Demo Mode Banner (Hidden by default in production per strict spec) -->
  <div id="standalone-demo-banner" class="demo-banner" style="display:none;">
    <div class="demo-banner-left">
      <span class="demo-badge">Demo Rejim</span>
      <span>Test rejimi</span>
    </div>
    <div class="demo-role-selector">
      <select id="demo-role-select" onchange="App.onRoleChange(this.value)">
        <option value="SUPER_ADMIN">Bosh Admin</option>
        <option value="ADMIN">Admin</option>
        <option value="USER">Mijoz</option>
      </select>
    </div>
  </div>

  <!-- Header -->
  <header class="app-header">
    <div class="header-brand">
      <div class="header-logo-icon">🚗</div>
      <div class="header-title-group">
        <h1>Avto Sklad</h1>
        <span>Ombor & Buxgalteriya ERP</span>
      </div>
    </div>
    <div class="header-actions">
      <div id="header-role-badge"></div>
      <button id="header-scanner-btn" class="btn btn-ghost btn-sm" onclick="ScannerView.open()" title="Shtrix-kod va QR Skaner" style="display:flex;align-items:center;justify-content:center;padding:4px 8px;" aria-label="Skaner">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
          <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
          <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
          <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
          <line x1="7" y1="12" x2="17" y2="12" stroke="#EF4444" stroke-width="2.2"></line>
        </svg>
      </button>
      <button id="header-ai-btn" class="btn btn-ghost btn-sm" onclick="AIAssistantView.open()" title="AI Ovozli Yordamchi" style="font-size:16px; padding: 4px 8px;">
        🤖
      </button>
      <button id="app-refresh-btn" class="btn btn-ghost btn-sm" onclick="App.refreshData()" title="Ma'lumotlarni yangilash (Real-time Refresh)" style="font-size:15px; padding: 4px 8px;">
        🔄
      </button>
      <button id="dnd-toggle-btn" class="btn btn-ghost btn-sm" onclick="App.toggleDND()" title="Bezovta qilinmasin (Do Not Disturb)" style="font-size:16px; padding: 4px 8px;">
        🔔
      </button>
      <button id="theme-toggle-btn" class="btn btn-ghost btn-sm" onclick="App.toggleTheme()" title="Mavzuni almashtirish">
        🌙
      </button>
    </div>
  </header>

  <!-- App Loading Screen -->
  <div id="app-loading-screen" style="position:fixed;inset:0;background:var(--bg-main);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999">
    <div style="width:44px;height:44px;border:3px solid var(--border);border-top-color:var(--brand-blue);border-radius:50%;animation:spin 0.8s linear infinite"></div>
    <p style="margin-top:16px;color:var(--text-muted);font-size:13px;font-weight:600">Avto Sklad tizimi yuklanmoqda...</p>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Main App Body -->
  <main class="app-container">
    <div id="tab-content"></div>
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav" id="bottom-nav"></nav>

  <!-- Modals and Bottom Sheets -->
  <div id="modal-overlay" class="modal-overlay" onclick="ProductsView.closeModal()">
    <div id="modal-root" onclick="event.stopPropagation()"></div>
  </div>

  <!-- Floating Quick Actions: Scanner & AI Chat (Co-located next to each other) -->
  <div class="floating-fab-group" id="floating-fab-group">
    <button class="quick-fab fab-scanner" onclick="ScannerView.open()" title="Shtrix-kod & QR Skaner" aria-label="Skaner">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
        <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
        <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
        <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
        <line x1="7" y1="12" x2="17" y2="12" stroke="#EF4444" stroke-width="2.2"></line>
        <line x1="7" y1="8" x2="7.01" y2="8"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
        <line x1="17" y1="8" x2="17.01" y2="8"></line>
        <line x1="7" y1="16" x2="7.01" y2="16"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
        <line x1="17" y1="16" x2="17.01" y2="16"></line>
      </svg>
      <span class="fab-text">Skaner</span>
    </button>
    <button class="quick-fab fab-ai" onclick="AIAssistantView.open()" title="AI Ovozli Yordamchi & Chat" aria-label="AI Yordamchi">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="22"></line>
      </svg>
      <span class="fab-text">AI Chat</span>
    </button>
  </div>

  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <!-- Scripts in dependency order -->
  <script src="/static/js/utils.js?v=6.0"></script>
  <script src="/static/js/state.js?v=6.0"></script>
  <script src="/static/js/api.js?v=6.0"></script>
  <script src="/static/js/charts.js?v=6.0"></script>
  <script src="/static/js/views/dashboard.js?v=6.0"></script>
  <script src="/static/js/views/products.js?v=6.0"></script>
  <script src="/static/js/views/inventory.js?v=6.0"></script>
  <script src="/static/js/views/stock_modal.js?v=6.0"></script>
  <script src="/static/js/views/transactions.js?v=6.0"></script>
  <script src="/static/js/views/analytics.js?v=6.0"></script>
  <script src="/static/js/views/user_catalog.js?v=6.0"></script>
  <script src="/static/js/views/admin_management.js?v=6.0"></script>
  <script src="/static/js/views/settings.js?v=6.0"></script>
  <script src="/static/js/views/scanner.js?v=6.0"></script>
  <script src="/static/js/views/voice_product.js?v=6.0"></script>
  <script src="/static/js/views/ai_assistant.js?v=6.0"></script>
  <script src="/static/js/app.js?v=6.0"></script>
</body>
</html>
